<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotkey Setting</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="hotkey-window">
  <header id="popupTitle" class="popup-titlebar">Hotkey Setting</header>
  <main>
    <div class="hotkey-row">
      <button id="captureHotkey" type="button">Start / Stop</button>
      <output id="hotkeyValue" aria-live="polite">q</output>
    </div>
    <div class="popup-actions">
      <button id="okButton" type="button">Ok</button>
      <button id="cancelButton" type="button">Cancel</button>
    </div>
  </main>
  <script src="theme-loader.js"></script><script src="localization.js"></script><script src="hotkey-window.js"></script>
</body>
</html>
