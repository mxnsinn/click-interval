# Registered Velocity backend that is restarted by Click Interval.
main-server=main

# Registered Velocity backend used as the always-on holding server.
maintenance-server=maintenance

# Text shown to players moved onto the registered maintenance backend.
default-message=The server is updating. You will be returned automatically.

# Maximum time to wait for every currently connected main-server player to
# reach the holding server before reporting that the drain is incomplete.
drain-timeout-seconds=15

# If a player has not reached the main backend in this time, restoration is
# considered incomplete and maintenance is armed again for the remaining users.
restore-timeout-seconds=20

# Optional public address migration. Blank permits every hostname as before.
# Other login addresses receive the correct address; status pings are unchanged.
# Loopback clients may still use localhost/127.0.0.1/::1.
required-hostname=
