plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version='1.0.0-test'
group='com.clickinterval.advancementprivacytest'
base { archivesName='AdvancementPrivacyTest-DO-NOT-DEPLOY' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
}
tasks.withType(JavaCompile).configureEach { options.release=25;options.encoding='UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false;reproducibleFileOrder=true }
java { sourceCompatibility=JavaVersion.VERSION_25;targetCompatibility=JavaVersion.VERSION_25 }
