plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = project.mod_version
group = 'com.clickinterval.solotest'
base { archivesName = 'SoloTestLauncher-Fabric' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly files('../server-market-fabric/dist/ServerMarket-Fabric-1.0.0+mc26.2.jar')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach {
    useJUnitPlatform(); maxParallelForks = 1; maxHeapSize = '192m'
    systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('test-tmp').get().asFile.absolutePath
    doFirst { layout.buildDirectory.dir('test-tmp').get().asFile.mkdirs() }
}
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.register('copyReleaseJar', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into layout.projectDirectory.dir('dist')
    rename { "SoloTestLauncher-Fabric-${project.mod_version}+mc26.2.jar" }
}
tasks.named('build') { finalizedBy tasks.named('copyReleaseJar') }
