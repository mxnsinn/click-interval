# Server Teleport for Fabric 26.2
# Accepted range: 5-300 seconds.
request-expiry-seconds=60
# Accepted range: 0-300 seconds.
request-cooldown-seconds=10
# Accepted range: 1-32 pending requests per recipient.
max-incoming-per-player=8
# Accepted range: 1-4096 total pending requests.
max-total-pending=1024
# Regular TPA may cross dimensions. /rtpa always stays in the origin dimension.
allow-cross-dimension=true
# /rtpa radius from spawn; runtime always caps this at 10000 and the world border.
random-teleport-radius=10000

# Set any message to an empty value to suppress it.
# Supported placeholders: {requester}, {target}, {seconds}, {requests}, {name}, {locations}, {max}, {entity}.
message.players-only=Only a player can use that command.
