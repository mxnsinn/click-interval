name: ProximityVoice
version: 1.0.0
main: dev.proximityvoice.plugin.ProximityVoicePlugin
api-version: '1.20'
authors: [Server Manager]
description: Encrypted proximity voice relay.
commands:
  proximityvoice:
    description: View proximity voice relay status.
    usage: /proximityvoice status
    aliases: [pvoice]
permissions:
  proximityvoice.use:
    description: Connect to the proximity voice relay.
    default: true
  proximityvoice.admin:
    description: View proximity voice relay diagnostics.
    default: op
