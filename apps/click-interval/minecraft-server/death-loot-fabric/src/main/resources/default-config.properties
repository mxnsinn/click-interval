# Server Death Loot for Fabric 26.2
# vanilla: normal Minecraft death drops.
# timed: only player-death drops use death-drop-lifetime-seconds.
# chest: player-death items go into a safe chest near the death location.
mode=chest

# Accepted range: 1-86400 seconds. Also used when chest placement safely falls back to drops.
death-drop-lifetime-seconds=300

# 0 keeps death chests permanently. Otherwise accepted range: 1-604800 seconds.
death-chest-lifetime-seconds=900

# Tries to place a torch in free air on each outer side. Existing blocks are never replaced.
place-torches=true
