<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crosshair Preview</title>
<style>:root{font:12px "Segoe UI",sans-serif;color:#fff;background:#101010}*{box-sizing:border-box}body{margin:0;overflow:hidden}.bar{height:29px;display:flex;align-items:center;justify-content:space-between;-webkit-app-region:drag}.title{padding-left:9px}.buttons{display:flex;-webkit-app-region:no-drag}.buttons button{width:40px;height:29px;border:0;color:#fff;background:transparent;font:16px "Segoe UI"}.buttons button:hover{background:#222}.buttons .close:hover{background:#c42b1c}.stage{position:relative;width:320px;height:310px;margin:7px 10px 0;border:1px solid #3a3a3a;border-radius:4px;overflow:hidden;background:#0b0b0b;background-image:linear-gradient(#252525 1px,transparent 1px),linear-gradient(90deg,#252525 1px,transparent 1px);background-size:20px 20px}canvas{width:320px;height:310px;display:block}.hint{height:27px;display:flex;align-items:center;justify-content:center;color:#777;font-size:10px}</style>
<link rel="stylesheet" href="theme.css"></head>
<body><header class="bar"><span class="title">Crosshair Preview</span><div class="buttons"><button id="min" type="button">&#x2212;</button><button id="close" class="close" type="button">&#x00D7;</button></div></header><div class="stage"><canvas id="preview" width="320" height="310"></canvas></div><div class="hint">Fire to preview bloom and recoil effects.</div><script src="crosshair-draw.js"></script><script src="crosshair-motion.js"></script><script src="theme-loader.js"></script><script src="crosshair-preview.js"></script></body></html>
