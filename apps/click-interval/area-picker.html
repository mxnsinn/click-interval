<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Select screen area</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; cursor: crosshair; font-family: "Segoe UI", sans-serif; }
    body { background: rgba(0, 0, 0, .68); }
    #selection { position: fixed; display: none; border: 2px dashed #fff; background: transparent; box-shadow: 0 0 0 10000px rgba(0, 0, 0, .68); }
    #hint { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); padding: 8px 12px; color: #fff; background: rgba(16, 16, 16, .94); border: 1px solid #555; border-radius: 5px; font-size: 12px; white-space: nowrap; pointer-events: none; }
  </style>
</head>
<body>
  <div id="selection"></div>
  <div id="hint">Click and drag to select an area. Press Escape to cancel.</div>
  <script src="area-picker.js"></script>
</body>
</html>
