<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: rgba(0,0,0,.08); cursor: crosshair; }
    #hint { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 12px; border: 1px solid rgba(255,255,255,.34); border-radius: 6px; color: #fff; background: rgba(12,12,12,.84); box-shadow: 0 3px 14px rgba(0,0,0,.42); font: 12px "Segoe UI", sans-serif; pointer-events: none; white-space: nowrap; }
  </style>
</head>
<body><div id="hint">Click the exact overlay position · Esc to cancel</div><script src="point-picker.js"></script></body>
</html>
