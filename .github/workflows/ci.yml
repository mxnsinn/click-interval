name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dependency security audit
        run: |
          npm audit --omit=dev --prefix apps/click-interval
          npm audit --omit=dev --prefix apps/click-interval/minecraft-server/vendor
      - name: Desktop regression samples
        working-directory: apps/click-interval
        run: |
          node macro-codec-test.js
          node voice-processor-continuity-test.js
          node minecraft-server-access-policy-test.js
