name: Build and sign Auto Clicker + Macro

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build reproducible unsigned Authenticode input
        shell: pwsh
        env:
          CI_UPDATE_PRIVATE_KEY: ${{ secrets.CI_UPDATE_PRIVATE_KEY }}
        run: ./scripts/build-auto-macro.ps1
      - name: Generate release evidence
        shell: pwsh
        run: |
          npm sbom --sbom-format spdx | Out-File -LiteralPath artifacts/click-interval-auto-macro.spdx.json -Encoding utf8
          $archive = Get-ChildItem -LiteralPath artifacts -Filter 'Click-Interval-*-win-x64.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Release archive is missing.' }
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Out-File -LiteralPath artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Upload unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: click-interval-auto-macro-unsigned
          path: artifacts/Click-Interval-*-win-x64.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: click-interval-auto-macro-release-evidence
          path: |
            artifacts/SHA256SUMS.txt
            artifacts/click-interval-auto-macro.spdx.json
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 90
      - name: Attest unsigned build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/Click-Interval-*-win-x64.zip
      - name: Submit signing request to SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed
      - name: Upload signed artifact
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: click-interval-auto-macro-signed
          path: artifacts/signed
          if-no-files-found: error
      - name: Publish unsigned preview release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID == '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem -LiteralPath artifacts -Filter 'Click-Interval-*-win-x64.zip' | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $archive.FullName artifacts/SHA256SUMS.txt artifacts/click-interval-auto-macro.spdx.json `
            --title "Click Interval $env:GITHUB_REF_NAME - Unsigned preview" `
            --notes-file RELEASE_NOTES.md --prerelease --verify-tag
